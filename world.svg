<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" fill="none">
  <title>Математический мир из кубиков</title>
  <desc>Оригинальный персонаж в фиолетовой футболке на парящем острове, ступени из блоков и математические знаки.</desc>
